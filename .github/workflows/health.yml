# Endpoint health: a daily, deterministic check (no LLM, no secrets) of every hosted MCP
# endpoint and every npm/PyPI package in the registry. scripts/probe-endpoints.mjs writes
# data/health.json; the build turns it into per-listing evidence levels and the /remotes/
# headline. The probe never changes a listing's status — 3+ consecutive failures only put
# the listing on the curator agenda (/api/pulse.json).
#
# main requires a PR, and PRs opened with GITHUB_TOKEN do not trigger auto-merge.yml, so this
# workflow merges its own PR — only when the PR's diff is exactly data/health.json and
# `npm test` passes — then dispatches deploy.yml (GITHUB_TOKEN merges do not fire `push`).
name: Endpoint health (daily)

on:
  schedule:
    - cron: "41 4 * * *" # daily 04:41 UTC, ahead of the 06:17 curator
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # dispatches deploy.yml after merging

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Exits non-zero (and writes nothing) if more than half the catalogue looks unreachable:
      # that is the runner's network, not 50 vendors dying at once.
      - name: Probe endpoints and packages
        run: node scripts/probe-endpoints.mjs

      - name: Detect change
        id: diff
        run: |
          other=$(git status --porcelain | grep -v ' data/health.json$' || true)
          if [ -n "$other" ]; then
            echo "::error::the probe touched files other than data/health.json"
            echo "$other"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- data/health.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/health.json unchanged; nothing to land." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The same gate deploy.yml runs. It regenerates the tracked MCP snapshots; only
      # data/health.json is committed below.
      - name: Validate, build and test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Open PR, check its diff, merge, deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date=$(date -u +%Y-%m-%d)
          branch="health/$date"
          summary=$(node -p "const s=require('./data/health.json').summary; \`\${s.answered} of \${s.endpoints} hosted endpoints answered (ok \${s.ok}, auth_required \${s.auth_required}, handshake_only \${s.handshake_only}, error \${s.error}, unreachable \${s.unreachable}; \${s.failing_3_or_more} failing 3+ checks in a row). Packages: \${s.packages_found} of \${s.packages} found, \${s.packages_missing} missing, \${s.packages_unknown} lookups failed.\`")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/health.json
          git commit -m "Endpoint health: $date" -m "$summary"
          git push --force origin "$branch"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Endpoint health: $date" \
              --body "Daily machine check from \`scripts/probe-endpoints.mjs\` (no LLM, no credentials, tools never called).

          $summary

          This workflow merges the PR itself when the diff is exactly \`data/health.json\` and \`npm test\` passes. Listings failing 3+ checks in a row appear on the pulse curator agenda; their status is never changed automatically."
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number -q '.[0].number')
          fi
          files=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path')
          if [ "$files" != "data/health.json" ]; then
            echo "::error::PR #$pr changes more than data/health.json; leaving it for a human:"
            echo "$files"
            exit 1
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Merged #$pr and dispatched deploy. $summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label automation-failure --state open --search "${{ github.workflow }}" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Automation failure: ${{ github.workflow }}" \
              --label automation-failure \
              --body "A scheduled/triggered run failed: $url

          Likely causes: the runner's network (the probe refuses to write when most endpoints look unreachable), npm test failing on the new data/health.json, or the merge being blocked by branch protection. The site keeps serving the last merged health data; evidence levels decay to package/docs after 7 days without a fresh check." \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "Automation failure: ${{ github.workflow }}" --body "Run failed: $url"
          fi
