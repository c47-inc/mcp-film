name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The gate is the whole suite: validation, template fixtures, build, build contracts,
      # recommendation and edge checks. dist/ is left on disk for the deploys below.
      - name: Build and test
        run: npm test
      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          missing="${missing# }"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped; missing repo secret(s): $missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert on skipped Cloudflare deploy
        if: steps.cloudflare.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCPFILM_GAP_TITLE: "Cloudflare deploy paused: missing repo secrets"
          MCPFILM_GAP_SUMMARY: "Missing repo secret(s): ${{ steps.cloudflare.outputs.missing }}"
          MCPFILM_GAP_DETAILS: |
            GitHub Pages fallback still deploys, but Cloudflare Pages is the production host that runs the edge worker for agent/API traffic analytics. Until these secrets are restored, pushes to main will not automatically update the Cloudflare deployment and edge analytics may lag behind the repo.

            Add the missing secret(s) under Settings → Secrets and variables → Actions, then rerun Build & Deploy.
        run: node scripts/report-automation-gap.mjs
      - name: Close Cloudflare deploy alert
        if: steps.cloudflare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCPFILM_GAP_TITLE: "Cloudflare deploy paused: missing repo secrets"
          MCPFILM_GAP_RECOVERED: "true"
        run: node scripts/report-automation-gap.mjs
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mcp-film --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      # IndexNow is told about the canonical host only, so it runs after the Cloudflare
      # deploy and never after the GitHub Pages fallback. The URL list is every HTML page in
      # dist/sitemap.xml (capped at IndexNow's 10,000 per request); the key is the one
      # site.json names and build.mjs publishes as /<key>.txt. A non-2xx answer fails the job.
      - name: Ping IndexNow
        if: steps.cloudflare.outputs.skip != 'true'
        run: |
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          const site = JSON.parse(fs.readFileSync("data/site.json", "utf8"));
          const key = site.indexnow_key;
          if (!key) { console.error("site.json has no indexnow_key"); process.exit(1); }
          const xml = fs.readFileSync("dist/sitemap.xml", "utf8");
          const urlList = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
            .map((m) => m[1])
            .filter((u) => u.endsWith("/"))
            .slice(0, 10000);
          const res = await fetch("https://api.indexnow.org/indexnow", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({ host: site.domain, key, keyLocation: `${site.url}/${key}.txt`, urlList }),
          });
          const body = await res.text();
          console.log(`IndexNow responded ${res.status} for ${urlList.length} URLs${body ? `: ${body.slice(0, 300)}` : ""}`);
          if (!res.ok) process.exit(1);
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label automation-failure --state open --search "${{ github.workflow }}" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Automation failure: ${{ github.workflow }}" \
              --label automation-failure \
              --body "A scheduled/triggered run failed: $url

          Likely causes: expired or unfunded ANTHROPIC_API_KEY, a revoked POSTHOG_API_KEY, a deprecated model ID, or an upstream action change. The site keeps serving either way — only self-updating is paused until this is fixed." \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "Automation failure: ${{ github.workflow }}" --body "Run failed: $url"
          fi
